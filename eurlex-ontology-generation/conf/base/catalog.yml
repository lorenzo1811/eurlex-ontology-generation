# Here you can define all your datasets by using simple YAML syntax.
#
# Documentation for this file format can be found in "The Data Catalog"
# Link: https://docs.kedro.org/en/stable/catalog-data/introduction/#data-catalog

# Original EurLex dataset
eurlex_raw:
  type: pandas.CSVDataset
  filepath: data/01_raw/EurLex_all.csv
  load_args:
    encoding: utf-8

# Cleaned corpus prepared from the original dataset
eurlex_corpus:
  type: pandas.CSVDataset
  filepath: data/02_intermediate/eurlex_corpus.csv
  fs_args:
    open_args_save:
      encoding: utf-8
    open_args_load:
      encoding: utf-8
  save_args:
    index: False
    encoding: utf-8
  load_args:
    encoding: utf-8

# Sample of the corpus selected for ontology extraction
eurlex_sample:
  type: pandas.CSVDataset
  filepath: data/03_primary/eurlex_sample.csv
  fs_args:
    open_args_save:
      encoding: utf-8
    open_args_load:
      encoding: utf-8
  save_args:
    index: False
    encoding: utf-8
  load_args:
    encoding: utf-8

# Corpus split into chunks ready for LLM processing
eurlex_chunks:
  type: pandas.CSVDataset
  filepath: data/03_primary/eurlex_chunks.csv
  fs_args:
    open_args_save:
      encoding: utf-8
    open_args_load:
      encoding: utf-8
  save_args:
    index: False
    encoding: utf-8
  load_args:
    encoding: utf-8

# Partial ontology extracted from each corpus chunk
ontology_candidates:
  type: pandas.CSVDataset
  filepath: data/04_feature/ontology_candidates.csv
  fs_args:
    open_args_save:
      encoding: utf-8
    open_args_load:
      encoding: utf-8
  save_args:
    index: False
    encoding: utf-8
  load_args:
    encoding: utf-8

# Reviews produced by the LLM judge for each ontology candidate
ontology_reviews:
  type: pandas.CSVDataset
  filepath: data/04_feature/ontology_reviews.csv
  fs_args:
    open_args_save:
      encoding: utf-8
    open_args_load:
      encoding: utf-8
  save_args:
    index: False
    encoding: utf-8
  load_args:
    encoding: utf-8

# The 5 ontologies after intra-ontology review (step a)
reviewed_ontologies:
  type: json.JSONDataset
  filepath: data/05_model_input/reviewed_ontologies.json
  save_args:
    indent: 2
  fs_args:
    open_args_save:
      encoding: utf-8

# Readable log of intra-ontology merge decisions (step a)
intra_review_report:
  type: json.JSONDataset
  filepath: data/08_reporting/intra_review_report.json
  save_args:
    indent: 2
  fs_args:
    open_args_save:
      encoding: utf-8

# Final single ontology (step b)
final_merged_ontology:
  type: json.JSONDataset
  filepath: data/07_model_output/final_merged_ontology.json
  save_args:
    indent: 2
  fs_args:
    open_args_save:
      encoding: utf-8

# Step-by-step tracing of iterative merge (step b)
merge_trace:
  type: json.JSONDataset
  filepath: data/08_reporting/merge_trace.json
  save_args:
    indent: 2
  fs_args:
    open_args_save:
      encoding: utf-8

# Profile mapping each ontology class into a fixed category (Phase 1)
concept_profile:
  type: json.JSONDataset
  filepath: data/05_model_input/concept_profile.json
  save_args:
    indent: 2

# Unvalidated ruleset extracted by the LLM from concept profile categories (Phase 2)
merge_rules_raw:
  type: MemoryDataset

# Validated and sanitized ruleset ready for deterministic execution (Phase 3)
merge_rules:
  type: json.JSONDataset
  filepath: data/05_model_input/merge_rules.json
  save_args:
    indent: 2

# Final single ontology produced via deterministic rule application (Phase 4)
final_merged_ontology_v2:
  type: json.JSONDataset
  filepath: data/07_model_output/final_merged_ontology_v2.json
  save_args:
    indent: 2

# Step-by-step log of rule hits during deterministic merging (Phase 4)
rule_application_trace:
  type: json.JSONDataset
  filepath: data/08_reporting/rule_application_trace.json
  save_args:
    indent: 2