# Parameters config for pipeline 'ontology_revision'
# using Kedro 1.4.0.
#
# Documentation for this file format can be found in "Parameters"
# Link: https://docs.kedro.org/en/1.4.0/configuration/parameters.html

ontology_revision:

  model: gemma3:4b  
  temperature: 0.0
  json_mode: true

  # The external batch orchestrator controls which batch is processed.
  batch_id: 0
  batch_group_size: 1000

  # Persistent directory containing ontology-review results.
  reviews_directory: data/04_feature/ontology_reviews

  # Persistent directory containing revised ontologies.
  output_directory: data/04_feature/ontology_revisions

  # Persistent directory containing revision validation reports.
  validation_output_directory: data/04_feature/ontology_revision_reports

  # Ollama generation options to avoid output truncation on long prompts (source text + ontology + review can be sizeable)
  num_ctx: 16384        # context window size (tokens)
  num_predict: 3072     # max tokens the model can generate for the answer

  system_prompt: |
    You are an expert ontology engineer specialized in ODRL 2.2, legal knowledge representation, and EUR-Lex documents.

    Your task is NOT to review an ontology.
    Your task is to CORRECT a Candidate Ontology by applying the amendments suggested by an expert reviewer, using the source EUR-Lex text fragment as ground truth.

    CRITICAL REVISION RULES:
    1. APPLY ALL AMENDMENTS: You MUST apply every item listed in "suggested_amendments" from the review. Do not ignore any of them.
    2. FIX WEAKNESSES: Address every issue listed in "weaknesses" (e.g. wrong ODRL_core/Legal_extension classification, empty rights_model, missing duties/permissions).
    3. ADD MISSING CONCEPTS: Every concept listed in "missing_concepts" MUST be added BOTH as a string in "odrl_alignment.extensions" AND as a full entry in "classes" with its own "name", "type", and "description" grounded in the source text.
    4. REMOVE HALLUCINATIONS: Remove or correct every concept listed in "hallucinations" and "unsupported_concepts". Do not keep unsupported claims.
    5. VALID CLASS TYPES: The "type" field of every entry in "classes" MUST be either one of the ODRL core types (Asset, Party, RightsHolder, Permission, Prohibition, Duty, Constraint) or exactly the string "Legal_extension". NEVER invent a custom type such as "Rate", "Currency", or "Tariff" as a "type" value — those are concept names, not ODRL types. If a concept like "Rate" or "Currency" needs its own class, its "type" must be "Legal_extension", and "Rate"/"Currency" is its "name".
    If a class in the Candidate Ontology has an invalid "type" (for example "ODRL_core"), you MUST replace it with the most appropriate ODRL core type (Asset, Party, RightsHolder, Permission, Prohibition, Duty, Constraint) or with "Legal_extension" if none fits. This rule takes precedence over rule 6.
    6. PRESERVE VALID CONTENT: Keep every class, relationship, and instance from the Candidate Ontology that was NOT flagged as wrong. Do not discard correct information.
    7. SCHEMA CONSTRAINT: The corrected ontology output MUST contain EXACTLY these top-level keys, nothing more and nothing less: "ontology_name", "description", "odrl_alignment", "classes", "relationships", "rights_model", "legal_patterns", "example_instances". NEVER include review-related fields such as "approved", "revision_required", "strengths", "weaknesses", "missing_concepts", "overall_score" in the output ontology.
    8. GROUNDING CONSTRAINT: Do not invent facts, entities, dates, currencies, or values that are not explicitly present in the provided source text. If the source text uses "ECU", do NOT convert or add "EUR" or any other currency not mentioned in the text. Never infer a modern currency (e.g. EUR) just because the topic is money — use only the currency actually named in the text.
    9. EXTENSIONS MUST MATCH CLASS NAMES: Every string listed in "odrl_alignment.extensions" MUST be exactly equal to the "name" field of one entry in "classes" — never the "type" field, and never a name that does not appear in "classes" at all. Double-check this correspondence before returning the output.

    IMPORTANT OUTPUT RULES:
    - Return ONLY a single valid JSON object.
    - Do NOT wrap JSON inside markdown blocks (do not use ```json).
    - NEVER return an empty JSON object like {} under any circumstances. Fill every field strictly.


  user_prompt_template: |
    Correct the following ontology candidate by applying the reviewer's feedback, using the provided EUR-Lex text fragment as ground truth.

    SOURCE EUR-LEX TEXT:
    {text}

    CANDIDATE ONTOLOGY TO CORRECT:
    {ontology}

    REVIEWER FEEDBACK (apply all suggested_amendments, fix all weaknesses, add missing_concepts as full classes, remove hallucinations/unsupported_concepts):
    {review}

    Return ONLY a single valid JSON object representing the CORRECTED ontology, containing EXACTLY these top-level keys (no more, no less): ontology_name, description, odrl_alignment, classes, relationships, rights_model, legal_patterns, example_instances.

    Example structure:

    {{
      "ontology_name": "...",
      "description": "...",
      "odrl_alignment": {{
        "core_entities": ["Asset", "Party", "Permission", "Duty", "Constraint"],
        "extensions": ["ExampleConcept"]
      }},
      "classes": [
        {{
          "name": "ExampleConcept",
          "type": "Legal_extension",
          "description": "..."
        }}
      ],
      "relationships": [
        {{
          "source": "...",
          "relation": "...",
          "target": "..."
        }}
      ],
      "rights_model": {{
        "permissions": [],
        "duties": []
      }},
      "legal_patterns": [
        {{
          "pattern_name": "...",
          "description": "...",
          "entities_involved": []
        }}
      ],
      "example_instances": [
        {{
          "entity": "...",
          "example_value": "...",
          "source_context": "..."
        }}
      ]
    }}

  # Parameters for the new validation node
  # Top-level keys that a valid ontology MUST have (exactly these, no more/less)
  expected_ontology_keys:
    - ontology_name
    - description
    - odrl_alignment
    - classes
    - relationships
    - rights_model
    - legal_patterns
    - example_instances

  # ODRL core types that are valid alongside "Legal_extension" for a class's "type" field
  valid_odrl_core_types:
    - Asset
    - Party
    - RightsHolder
    - Permission
    - Prohibition
    - Duty
    - Constraint

  # Terms that should never appear as a "currency" value unless present in
  # the source text — used as a lightweight grounding/hallucination check.
  disallowed_currency_terms:
    - EUR
    - USD
    - GBP

  # phrases that would otherwise create false-positive hallucination
  # matches (e.g. "EUR-Lex", the EU legal database name, is NOT the Euro
  # currency) and must be stripped from both texts before the currency
  # check runs.
  currency_check_exclusions:
    - "EUR-Lex"