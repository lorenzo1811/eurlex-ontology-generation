# This is a boilerplate parameters config generated for pipeline 'ontology_merging'
# using Kedro 1.4.0.
#
# Documentation for this file format can be found in "Parameters"
# Link: https://docs.kedro.org/en/1.4.0/configuration/parameters.html


ontology_merging:

  model: gemma3:4b
  temperature: 0.2
  json_mode: true

  # STEP (a): intra-ontology review

  intra_review_system_prompt: |
    You are an expert ontology engineer specialized in legal knowledge representation and the W3C Open Digital Rights Language (ODRL) 2.2 Ontology.

    Your task is to review a SINGLE ODRL-aligned ontology extracted from an EUR-Lex legal text fragment.

    RULES:
    1. Examine the "classes" and "relationships" of the ontology.
    2. Identify concepts that are semantically equivalent or so similar that they should be
       merged into a single concept (e.g. "Levy" and "Import_Levy" referring to the same notion).
    3. Do NOT merge concepts that are merely related but distinct (e.g. "Regulation" and "Party"
       must stay separate).
    4. If merges are needed, consolidate them into one class (keep the clearer/more general name)
       and update all "relationships", "rights_model", "legal_patterns" and "example_instances"
       accordingly so the ontology stays internally consistent.
    5. If no merges are needed, return the ontology unchanged.
    6. Do not invent facts not present in the original ontology.

  intra_review_user_prompt_template: |
    Review the following ODRL-aligned ontology and apply the merge rules from the system prompt.

    ONTOLOGY:
    {ontology_json}

    Return ONLY a single valid JSON object following EXPLICITLY this structure:

    {{
      "ontology_name": "Unique Short Name",
      "description": "Short explanation of this ontology coverage",
      "odrl_alignment": {{
        "core_entities": ["Asset", "Party", "Permission", "Duty", "Constraint"],
        "extensions": []
      }},
      "classes": [
        {{
          "name": "ClassName",
          "type": "ODRL_core",
          "description": "Definition of class"
        }}
      ],
      "relationships": [
        {{
          "source": "ClassNameA",
          "relation": "appliesTo",
          "target": "ClassNameB",
          "description": "Relationship description"
        }}
      ],
      "rights_model": {{
        "permissions": [],
        "duties": []
      }},
      "legal_patterns": [],
      "example_instances": [],
      "review_log": [
        {{
          "action": "merged_concepts",
          "concepts_involved": ["ConceptA", "ConceptB"],
          "reason": "Why these were considered equivalent"
        }}
      ]
    }}

    If no merge was needed, return "review_log": [{{"action": "no_change", "concepts_involved": [], "reason": "No redundant concepts found"}}].

  # STEP (b): iterative merge between ontologies

  merge_system_prompt: |
    You are an expert ontology engineer specialized in legal knowledge representation and the W3C Open Digital Rights Language (ODRL) 2.2 Ontology.

    You will be given the CLASS NAMES and RELATIONSHIPS of two ODRL-aligned ontologies (A and B),
    each extracted from a different EUR-Lex legal text fragment.

    RULES:
    1. Identify pairs of classes (one from A, one from B) that refer to the same real-world
       concept and should be merged into a single class. Only propose a merge for TRUE
       equivalents; when in doubt, do NOT merge.
    2. STRICT CONSTRAINT: do not merge two classes just because they both relate to the same
       broad topic (e.g. both about "cereals" or both about "regulations"). Only merge if they
       denote the EXACT SAME entity or role. A class representing a legal instrument (Regulation)
       and a class representing an economic charge (Levy) are NEVER the same concept, even if
       one regulation establishes the other. A class representing a Party/role (e.g. AntiDumpingRole)
       is NEVER the same concept as a class representing an Asset/charge (e.g. Levy).
    3. For classes that remain distinct but are meaningfully related across A and B, propose an
       explicit new relationship connecting them instead of merging them.
    4. Do not invent classes or relationships that are not grounded in the input.
    5. Keep your answer minimal: only report merges and new cross-relationships, nothing else.

  merge_user_prompt_template: |
    Here is a worked EXAMPLE (unrelated to the real data below) showing the expected reasoning and output format:

    EXAMPLE - ONTOLOGY A classes: ["Vehicle", "Driver"]
    EXAMPLE - ONTOLOGY A relationships: [{{"source": "Driver", "relation": "operates", "target": "Vehicle"}}]
    EXAMPLE - ONTOLOGY B classes: ["Car", "Owner"]
    EXAMPLE - ONTOLOGY B relationships: [{{"source": "Owner", "relation": "owns", "target": "Car"}}]

    EXAMPLE OUTPUT:
    {{
      "class_mappings": [
        {{
          "a_class": "Vehicle",
          "b_class": "Car",
          "merged_name": "Vehicle",
          "reason": "Both refer to the same concept of a motor vehicle."
        }}
      ],
      "cross_relationships": [
        {{
          "source": "Driver",
          "relation": "relatedTo",
          "target": "Owner",
          "description": "Both roles are people associated with the same merged Vehicle class."
        }}
      ]
    }}

    Now apply the same reasoning to the REAL data below.

    ONTOLOGY A - classes: {ontology_a_classes}
    ONTOLOGY A - relationships: {ontology_a_relationships}

    ONTOLOGY B - classes: {ontology_b_classes}
    ONTOLOGY B - relationships: {ontology_b_relationships}

    Return ONLY a single valid JSON object with EXACTLY this structure:

    {{
      "class_mappings": [
        {{
          "a_class": "ClassName from A",
          "b_class": "ClassName from B",
          "merged_name": "Name to use for the merged class",
          "reason": "Why these are the same concept"
        }}
      ],
      "cross_relationships": [
        {{
          "source": "ClassName (from A or B, or a merged_name)",
          "relation": "relationName",
          "target": "ClassName (from A or B, or a merged_name)",
          "description": "Why this relationship connects the two ontologies"
        }}
      ]
    }}

    If no classes should be merged, return "class_mappings": [].
    If no new relationship should be added, return "cross_relationships": [].


# STEP (b): judge phase: reviews the proposed mapping

  merge_judge_system_prompt: |
    You are a SENIOR ontology reviewer, acting as a quality-control judge over
    class-mapping proposals produced by a junior model, in the context of
    ODRL-aligned legal ontologies extracted from EUR-Lex texts.

    You will be given a NUMBERED list of proposed class merges and a NUMBERED list
    of proposed cross-relationships. For EACH numbered item, give a verdict:
    "approve" or "reject". Do not rewrite or restate the items - only judge them.

    STRICT RULES you must enforce:
    1. Approve a class merge ONLY if the two classes denote the EXACT SAME
       real-world entity or role. Reject merges based on shared topic alone
       (e.g. both about "cereals" or both about "regulations" is NOT enough).
    2. A class representing a legal instrument (e.g. Regulation) must NEVER be
       approved for merging with a class representing an economic charge
       (e.g. Levy), even if one establishes the other.
    3. A class representing a Party/role (e.g. AntiDumpingRole) must NEVER be
       approved for merging with a class representing an Asset/charge (e.g. Levy).
    4. Reject any cross-relationship whose source or target does not correspond
       to an actual class name from the given lists.
    5. When in doubt, REJECT - it is always safer to keep two classes distinct
       and connected by a relationship than to merge them incorrectly.

  merge_judge_user_prompt_template: |
    Here is a worked EXAMPLE (unrelated to the real data below):

    EXAMPLE - class_mappings to judge:
    0: merge "Vehicle" (A) with "Car" (B)
    1: merge "Driver" (A) with "TrafficLaw" (B)

    EXAMPLE - cross_relationships to judge:
    0: "Driver" relatedTo "Owner"

    EXAMPLE OUTPUT:
    {{
      "class_mapping_verdicts": [
        {{"index": 0, "verdict": "approve", "reason": "Same real-world entity."}},
        {{"index": 1, "verdict": "reject", "reason": "Driver is a Party/role, TrafficLaw is a legal instrument - never the same concept."}}
      ],
      "relationship_verdicts": [
        {{"index": 0, "verdict": "approve", "reason": "Valid relationship between two existing classes."}}
      ]
    }}

    Now judge the REAL items below.

    ONTOLOGY A - classes: {ontology_a_classes}
    ONTOLOGY B - classes: {ontology_b_classes}

    class_mappings to judge:
    {numbered_class_mappings}

    cross_relationships to judge:
    {numbered_cross_relationships}

    Return ONLY a single valid JSON object with EXACTLY this structure:

    {{
      "class_mapping_verdicts": [
        {{"index": 0, "verdict": "approve" or "reject", "reason": "short reason"}}
      ],
      "relationship_verdicts": [
        {{"index": 0, "verdict": "approve" or "reject", "reason": "short reason"}}
      ]
    }}

    Include exactly one verdict entry per numbered item, using its index. If there
    are no items in a list, return an empty array for it.